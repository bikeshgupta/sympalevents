<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="SymPal Events">
  <!--
    Six people around a shared centre, in warm gold on the brand teal.

    Same geometry as the PNG app icons in this folder, generated by
    scripts/make-icons.ps1 — the shape is authored in a 1024x1024 space so the
    vector tab icon and the rasterised home-screen icons are literally the same
    drawing. Change one and you must change the other.

    The committee rather than the festival: this app is multi-event, so a diya
    or a modak would date it to one celebration, while a group of residents
    organising something together does not.

    Each figure is a head circle and a separate shoulder dome with a 12-unit
    gap, the dome wider than the head so the silhouette narrows at the neck.
    Overlapping them makes the pair read as a heart. The gradient is declared
    in the figure's own local space and rotates with it, so all six are shaded
    identically — one gradient across the whole icon left the top of the ring
    pale and the bottom deep orange, and they stopped reading as one group.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D5B5E"/>
      <stop offset="1" stop-color="#103C3F"/>
    </linearGradient>
    <linearGradient id="person" gradientUnits="userSpaceOnUse" x1="0" y1="-112" x2="0" y2="84">
      <stop offset="0" stop-color="#FFE4A0"/>
      <stop offset="1" stop-color="#F6BE60"/>
    </linearGradient>
    <g id="figure" fill="url(#person)">
      <circle cx="0" cy="-58" r="50"/>
      <path d="M-72 75 A72 75 0 0 1 72 75 Z"/>
    </g>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <g transform="translate(512 512)">
    <g transform="rotate(0)   translate(0 -262)"><use href="#figure"/></g>
    <g transform="rotate(60)  translate(0 -262)"><use href="#figure"/></g>
    <g transform="rotate(120) translate(0 -262)"><use href="#figure"/></g>
    <g transform="rotate(180) translate(0 -262)"><use href="#figure"/></g>
    <g transform="rotate(240) translate(0 -262)"><use href="#figure"/></g>
    <g transform="rotate(300) translate(0 -262)"><use href="#figure"/></g>
  </g>

  <circle cx="512" cy="512" r="136" fill="#FFF4D6"/>
  <circle cx="512" cy="512" r="66" fill="#E27A3E"/>
</svg>
